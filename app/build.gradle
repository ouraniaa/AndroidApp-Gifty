plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.androidapp'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.example.androidapp"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Gifty AI backend (Cloudflare Worker). This is a public URL, not a secret:
        // the Gemini API key lives only in Cloudflare and is never part of the app.
        buildConfigField "String", "GIFTY_AI_BASE_URL", "\"https://gifty-ai-api.papadopoulouourania20.workers.dev\""

        // Explicit development/testing switch for offline sample templates.
        // Off by default; enable with: ./gradlew assembleDebug -PgreetingMockMode=true
        buildConfigField "boolean", "GREETING_CARD_MOCK_MODE", (project.findProperty("greetingMockMode") == "true") ? "true" : "false"
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.core.splashscreen
    testImplementation libs.junit
    // Real org.json for local unit tests (android.jar only ships stubs that throw)
    testImplementation 'org.json:json:20250517'
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation "androidx.core:core-splashscreen:1.0.1"

    // Για τις λίστες προϊόντων και την εμφάνιση σε κάρτες (Διάλεξη 7)
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Για το Barcode Scanner (το έξυπνο feature που είπαμε)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Για όμορφα κουμπιά και σχεδιασμό (Διάλεξη 5)
    implementation 'com.google.android.material:material:1.9.0'
}